<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>退院後の体験談デモ</title><style>body{margin:0;background:#fbfdfc;color:#29463d;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;line-height:1.8}.wrap{max-width:980px;margin:auto;padding:28px 18px 60px}.top{background:white;border:1px solid #dfe9e4;border-radius:20px;padding:24px}.top h1{margin:0 0 7px;font-family:serif;font-weight:500;color:#244f43}.demo{display:inline-block;background:#fff3cd;border:1px solid #ead69a;color:#7a6521;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:700}.lead{font-size:13px;color:#6a7d75}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:18px}.card{border:1px solid #dfe9e3;background:#fff;border-radius:16px;padding:16px;text-align:left;cursor:pointer}.card:hover{box-shadow:0 8px 24px rgba(34,73,58,.08)}.person{font-size:12px;font-weight:700}.tags{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}.tags span{font-size:10px;border:1px solid #e0e8e3;border-radius:999px;padding:2px 7px;color:#6d7d76}.quote{font-family:serif;font-size:15px;color:#38584e}.read{font-size:11px;color:#247160;font-weight:700}.future{margin-top:16px;font-size:12px;color:#71837a}.back{display:inline-block;margin-top:22px;font-size:12px;color:#325f52}.modal{position:fixed;inset:0;background:rgba(20,42,35,.48);display:none;align-items:center;justify-content:center;padding:18px}.modal.open{display:flex}.box{width:min(650px,100%);max-height:85vh;overflow:auto;background:#fff;border-radius:20px;padding:24px;position:relative}.close{position:absolute;right:12px;top:10px;border:1px solid #dce6e1;background:#fff;border-radius:50%;width:34px;height:34px;font-size:18px}.box h2{font-family:serif;font-weight:500;margin:13px 40px 6px 0}.meta{font-size:11px;color:#71827b}.body{font-size:13px;color:#536b62}.points{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:16px}.point{background:#f6faf8;border-radius:12px;padding:12px}.point b{display:block;font-size:10px;color:#34715e}.point span{font-size:11px}.foot{font-size:10px;color:#87938e;margin-top:14px}@media(max-width:700px){.grid,.points{grid-template-columns:1fr}}</style></head><body><div class="wrap"><section class="top"><span class="demo">表示テスト｜以下はすべて架空の話です</span><h1>この状況を経験した人の話</h1><p class="lead">将来は質問票の回答から、年齢・病気・本人／家族・選んだ場所・相談先などが近い体験を表示する想定です。</p><div class="grid"><button class="card" data-id="a"><div class="person">母の退院を支えた家族</div><div class="tags"><span>70代</span><span>脳梗塞</span><span>自宅へ退院</span></div><div class="quote">「家では無理だと思っていたけど、何が無理なのか自分でも分かっていませんでした。」</div><div class="read">体験を読む →</div></button><button class="card" data-id="b"><div class="person">本人</div><div class="tags"><span>40代</span><span>事故後</span><span>リハビリ転院</span></div><div class="quote">「退院と言われたら家に帰るものだと思っていました。」</div><div class="read">体験を読む →</div></button><button class="card" data-id="c"><div class="person">父の支援をした家族</div><div class="tags"><span>80代</span><span>認知症</span><span>施設を選択</span></div><div class="quote">「『施設』って一種類だと思っていました。」</div><div class="read">体験を読む →</div></button></div><div class="future">将来：実際の投稿データから「あなたの状況に近い体験」を絞り込み表示。</div></section><a class="back" href="discharge_destination.html">← 退院後の暮らしβ版へ戻る</a></div><div class="modal" id="modal"><div class="box"><button class="close" id="close">×</button><span class="demo">表示テスト｜架空の話</span><h2 id="title"></h2><div class="meta" id="meta"></div><div class="body" id="body"></div><div class="points"><div class="point"><b>最初に相談した相手</b><span id="consult"></span></div><div class="point"><b>もっと早く知りたかったこと</b><span id="wish"></span></div></div><div class="foot">※表示確認のために作成した架空の内容です。実在の人物・出来事とは関係ありません。</div></div></div><script>const d={a:{t:'「自宅は無理」と思っていたけれど',m:'70代の母｜脳梗塞後｜家族の立場｜自宅へ退院',b:'<p>母の退院の話が出たとき、私は最初から「家では無理です」と答えていました。歩くのも手伝いが必要で、仕事もあるからです。</p><p>病棟で相談すると退院支援の担当者につながり、訪問看護や福祉用具などを組み合わせられることを知りました。結局、自宅に戻ることを選びましたが、「家族だけで全部やる」か「施設に入る」かの二択ではないと知れたことが大きかったです。</p>',c:'病棟看護師 → 退院支援担当者',w:'自宅療養は家族だけで支えるものではないこと'},b:{t:'「退院＝家に帰る」ではなかった',m:'40代｜事故後｜本人の立場｜リハビリ病院へ転院',b:'<p>事故後に「退院について考えましょう」と言われ、まだ普通に歩けないのに家へ帰るのかと思いました。</p><p>説明を受けて、急性期の治療後にリハビリを続けるため別の病院へ移る選択があると知りました。最終的にはリハビリ病院へ移り、その後自宅へ戻りました。</p>',c:'主治医・リハビリスタッフ・退院支援担当者',w:'急性期病院を出た後にも段階があること'},c:{t:'「施設」って全部同じだと思っていた',m:'80代の父｜認知症｜家族の立場｜施設で生活',b:'<p>父の退院が近づき、家での生活は難しそうだと言われました。私は「老人ホームを探せばいい」と思っていました。</p><p>相談すると、施設ごとに受けられる介護や医療、費用、条件が違うと知りました。父に必要な支援を整理してから候補を探したことで、比較しやすくなりました。</p>',c:'医療ソーシャルワーカー・ケアマネジャー',w:'施設名より先に必要な支援を整理すること'}};const modal=document.getElementById('modal');document.querySelectorAll('.card').forEach(x=>x.onclick=()=>{const s=d[x.dataset.id];title.textContent=s.t;meta.textContent=s.m;body.innerHTML=s.b;consult.textContent=s.c;wish.textContent=s.w;modal.classList.add('open')});function shut(){modal.classList.remove('open')}close.onclick=shut;modal.onclick=e=>{if(e.target===modal)shut()};document.onkeydown=e=>{if(e.key==='Escape')shut()};</script></body></html>
