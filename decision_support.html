(async function(){
 try{
  const res=await fetch('decision_support_base.html',{cache:'no-store'});

  h=h.replace('</head>', "<style id=\"decisionSupportSyncStyles\">\n.choice{position:relative!important}.choice input{display:block!important;position:absolute!important;opacity:0!important;width:1px!important;height:1px!important;pointer-events:none!important}\n.choice>span{display:block;border:1px solid #bdd0df;border-radius:9px;background:#fff;padding:8px 11px;font-size:12px;cursor:pointer}.choice input:checked+span{background:#173d68;color:#fff;border-color:#173d68;box-shadow:0 0 0 2px rgba(23,61,104,.08)}.choice input:focus-visible+span{outline:3px solid rgba(40,94,143,.25);outline-offset:2px}.scale .choice>span{min-width:37px;text-align:center}\n.legacy-step1-sheet{display:none!important}\n@media print{.legacy-step1-sheet{display:none!important}}\n</style>"+'</head>');
  h=h.replace('</body>', '<script>'+"\n(function(){\n  document.querySelectorAll('label.choice > label').forEach(function(inner){\n    var span=document.createElement('span');\n    span.innerHTML=inner.innerHTML;\n    inner.replaceWith(span);\n  });\n\n  var step1=document.getElementById('step1');\n  if(step1){\n    var legacy=[...step1.querySelectorAll(':scope > section.sheet')].find(function(s){\n      return s.textContent.includes('STEP1の入力を自動整理') || s.querySelector('#s-cause');\n    });\n    if(legacy){ legacy.classList.add('legacy-step1-sheet'); legacy.setAttribute('aria-hidden','true'); }\n    if(!document.getElementById('step1UnifiedNotice')){\n      var holder=document.createElement('div');\n      holder.id='step1UnifiedNotice';\n      holder.innerHTML=\"<section class=\\\"sheet no-print\\\" style=\\\"background:#f8fbfd\\\">\\n<div class=\\\"sheet-head\\\">\\n<div>\\n<h2>ここまでの内容は、STEP5で1枚にまとめます</h2>\\n<div class=\\\"micro\\\">STEP1では結論やPDFを作りません。STEP2〜4で方法・その先・本人の価値観まで整理してから、最後に医療者との話し合い準備シートを作ります。</div>\\n</div>\\n<button class=\\\"btn secondary\\\" onclick=\\\"goStep(5)\\\" type=\\\"button\\\">最終シートを確認 →</button>\\n</div>\\n</section>\";\n      var node=holder.firstElementChild;\n      if(legacy) legacy.before(node); else step1.appendChild(node);\n    }\n    var copy=step1.querySelector('.bottomnav .nextcopy');\n    if(copy) copy.textContent='ここまでの回答は保存され、STEP5の「医療者との話し合い準備シート」にSTEP2〜4の内容と一緒にまとめられます。';\n  }\n\n  var finalSheet=document.getElementById('finalSheet');\n  if(finalSheet) finalSheet.innerHTML=\"\\n<div class=\\\"sheet-head\\\">\\n<div>\\n<h2>医療者との話し合い準備シート｜食べること・栄養について</h2>\\n<div class=\\\"micro\\\">STEP1〜4の回答を1枚に自動整理｜診断書・ACP完成書類・治療方針の決定書ではありません</div>\\n</div>\\n<button class=\\\"btn secondary no-print\\\" id=\\\"printFinalTop\\\" type=\\\"button\\\">印刷・PDF</button>\\n</div>\\n<div class=\\\"cols2\\\" style=\\\"margin-top:14px\\\">\\n<div class=\\\"softcard\\\">\\n<h3>① 医療者から受けている説明・今の状態</h3>\\n<div class=\\\"sumrow\\\"><b>食べられなくなった原因の説明</b><span class=\\\"sumval\\\" id=\\\"f-cause\\\">未回答</span></div>\\n<div class=\\\"sumrow\\\"><b>回復見込みの説明</b><span class=\\\"sumval\\\" id=\\\"f-recovery\\\">未回答</span></div>\\n<div class=\\\"sumrow\\\"><b>現在の食事状況</b><span class=\\\"sumval\\\" id=\\\"f-eating\\\">未回答</span></div>\\n<div class=\\\"sumrow\\\"><b>選択肢の理解度</b><span class=\\\"sumval\\\" id=\\\"f-understanding\\\">未回答</span></div>\\n</div>\\n<div class=\\\"softcard patient\\\">\\n<h3>② 本人の現在の意思・反応</h3>\\n<div class=\\\"sumrow\\\"><b>本人の現在の意思表出</b><span class=\\\"sumval\\\" id=\\\"f-expression\\\">未回答</span></div>\\n<div class=\\\"sumrow\\\"><b>医療・ケアへの現在の反応</b><span class=\\\"sumval\\\" id=\\\"f-current-indirect\\\">未記入</span></div>\\n<div class=\\\"sumrow\\\"><b>本人の意思がどの程度分かるか</b><span class=\\\"sumval\\\" id=\\\"f-willclarity\\\">未回答</span></div>\\n</div>\\n</div>\\n<div class=\\\"cols2\\\" style=\\\"margin-top:11px\\\">\\n<div class=\\\"softcard patient\\\">\\n<h3>③ 本人について分かっていること・本人らしさ</h3>\\n<div class=\\\"sumrow\\\"><b>以前、本人が直接話していたこと</b><span class=\\\"sumval\\\" id=\\\"f-past-direct\\\">未記入</span></div>\\n<div class=\\\"sumrow\\\"><b>本人らしさが分かるエピソード</b><span class=\\\"sumval\\\" id=\\\"f-past-indirect\\\">未記入</span></div>\\n<div class=\\\"sumrow\\\"><b>本人が大切にしていた役割・習慣</b><span class=\\\"sumval\\\" id=\\\"f-story\\\">未記入</span></div>\\n<div class=\\\"sumrow\\\"><b>STEP1で書いた本人の価値観</b><span class=\\\"sumval\\\" id=\\\"f-values-old\\\">未記入</span></div>\\n<div class=\\\"sumrow\\\"><b>食べることについての過去の言葉</b><span class=\\\"sumval\\\" id=\\\"f-foodvalues\\\">未回答</span></div>\\n<div class=\\\"sumrow\\\"><b>覚えている本人の言葉</b><span class=\\\"sumval\\\" id=\\\"f-foodmemory\\\">未記入</span></div>\\n<div class=\\\"sumrow\\\"><b>本人らしさとして大切だったもの</b><span class=\\\"sumval\\\" id=\\\"f-identity\\\">未回答</span></div>\\n<div class=\\\"sumrow\\\"><b>その他の本人らしさ</b><span class=\\\"sumval\\\" id=\\\"f-identityother\\\">未記入</span></div>\\n<div class=\\\"sumrow\\\"><b>本人なら今回どう言うと思うか</b><span class=\\\"sumval\\\" id=\\\"f-imagined\\\">未記入</spa "final_extra_question\\\" placeholder=\\\"例：胃ろうを作らずに口から食べ続ける場合、どんな支援ができますか？\\\"></textarea>\\n</div>\\n<div class=\\\"sumrow\\\" id=\\\"final-extra-print-row\\\" style=\\\"display:none\\\"><b>追加で聞きたいこと</b><span class=\\\"sumval\\\" id=\\\"f-extra\\\"></span></div>\\n</div>\\n<div class=\\\"research-note\\\">\\n      このシートは、本人の価値観、家族の理解や迷い、医学的な状況を共有し、本人・家族・医療者が一緒に考えるための補助資料です。\\n      医療上の適応や方針は、本人の状態を診ている医療者と確認してください。\\n    </div>\\n\";\n  var step5=document.getElementById('step5');\n  if(step5){\n    var oldBottom=[...step5.children].find(function(el){ return el.classList && el.classList.contains('bottomnav'); });\n    if(oldBottom){\n      var holder2=document.createElement('div'); holder2.innerHTML=\"<div class=\\\"bottomnav no-print\\\">\\n<button class=\\\"btn secondary\\\" onclick=\\\"goStep(4)\\\">← STEP 4へ</button>\\n<div class=\\\"nextcopy\\\">回答はこの端末のブラウザ内に自動保存されます。不要になったら右のボタンで消せます。</div>\\n<div>\\n<button class=\\\"btn ghost\\\" id=\\\"resetAllBtn\\\" type=\\\"button\\\">入力をリセット</button>\\n<button class=\\\"btn primary bigbtn\\\" id=\\\"printFinalBottom\\\" type=\\\"button\\\">印刷・PDFにする →</button>\\n</div>\\n</div>\";\n      oldBottom.replaceWith(holder2.firstElementChild);\n    }\n  }\n\n  updateFinalSummary = function(){\n    try{ updateSummary(); }catch(e){}\n    setFinal('f-cause',sel('cause'));\n    setFinal('f-recovery',sel('recovery'));\n    setFinal('f-eating',sel('eating'));\n    setFinal('f-understanding',sel('understanding'));\n    setFinal('f-expression',sel('expression'));\n    setFinal('f-current-indirect',txt('current_indirect'),'未記入');\n    setFinal('f-past-direct',txt('past_direct'),'未記入');\n    setFinal('f-past-indirect',txt('past_indirect'),'未記入');\n    setFinal('f-story',txt('story'),'未記入');\n    setFinal('f-patient-guess',txt('patient_guess'),'未記入');\n\n    var heard=checkedOptions();\n    setFinal('f-heard',heard.join('、'));\n    var learnNames=[...learnMore].map(function(k){ var mm=METHOD_INFO.find(function(x){return x.key===k}); return mm&&mm.title; }).filter(Boolean);\n    setFinal('f-learn',learnNames.length?learnNames.join('、'):'未選択','未選択');\n    var m=METHOD_INFO.find(function(x){return x.key===currentEvidenceMethod});\n    setFinal('f-step3method',m?m.title:'未選択','未選択');\n    setFinal('f-unknowns',txt('unknowns'),'未記入');\n\n    var clarity=sel('s4_will_clarity');\n    var foodVals=multiByName('s4_food_values');\n    var identityVals=multiByName('s4_identity_values');\n    var scale=sel('s4_longevity_comfort');\n    var imaginedUnknown=document.getElementById('s4_imagined_unknown') && document.getElementById('s4_imagined_unknown').checked;\n    var imagined=imaginedUnknown?'分からない':txt('s4_imagined_voice');\n\n    setFinal('f-willclarity',clarity);\n    setFinal('f-foodvalues',foodVals.length?foodVals.join('、'):'未回答');\n    setFinal('f-foodmemory',txt('s4_food_memory'),'未記入');\n    setFinal('f-imagined',imagined,'未記入');\n    setFinal('f-identity',identityVals.length?identityVals.join('、'):'未回答');\n    setFinal('f-identityother',txt('s4_identity_other'),'未記入');\n    setFinal('f-scale',scale);\n    setFinal('f-values-old',txt('values'),'未記入');\n    setFinal('f-family',txt('family_feeling'),'未記入');\n    setFinal('f-difference',sel('difference'));\n    setFinal('f-current',sel('s4_current_position'));\n    setFinal('f-questions',txt('questions'),'未記入');\n\n    var unknown=[];\n    if(['家族で推測している','ほとんど分からない','答えたくない'].includes(clarity)) unknown.push('本人の意思：'+clarity);\n    if(foodVals.includes('特に聞いたことはない')) unknown.push('食べることについて本人から聞いたこと：特にない');\n    if(scale==='分からない') unknown.push('長く生きることと、苦痛・負担を少なくすることのどちらを重視していたか：分からない');\n    if(imaginedUnknown) unknown.push('今回の選択について本人が何と言うと思うか：分からない');\n    var unknownEl=document.getElementById('f-unknown-person');\n    if(unknownEl){\n      unknownEl.innerHTML=unknown.length?'<ul style=\"margin:0 0 0 18px;padding:0\">'+unknown.map(function(x){return '<li>'+escapeHtml(x)+'</li>';}).join('')+'</ul>':'明確な「分からない」の回答はまだありません。';\n    }\n  };\n\n  print   document.open(); document.write(h); document.close();
 }catch(e){
  document.body.innerHTML='<main style="max-width:760px;margin:50px auto;font-family:sans-serif;padding:20px"><h1>読み込みに失敗しました</h1><p>ページを再読み込みしてください。</p><pre>'+String(e)+'</pre></main>';
 }
