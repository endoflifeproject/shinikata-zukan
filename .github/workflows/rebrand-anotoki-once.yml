name: One-time rebrand to Anotoki

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebrand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace old brand text across live site files
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = [
              ('終活ラボ', 'アノトキ'),
              ('SHUKATSU LAB', 'ANOTOKI'),
              ('Shukatsu Lab', 'Anotoki'),
          ]

          changed = []
          for pattern in ('*.html', '*.js'):
              for path in Path('.').rglob(pattern):
                  if '.git' in path.parts:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8')
                  except UnicodeDecodeError:
                      continue
                  new = text
                  for old, replacement in replacements:
                      new = new.replace(old, replacement)
                  if new != text:
                      path.write_text(new, encoding='utf-8')
                      changed.append(str(path))

          print('Changed files:')
          for path in changed:
              print(' -', path)
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/rebrand-anotoki-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "サイト全体のブランド名をアノトキに統一"
          git push
