name: One-off support average consistency
on:
  push:
    paths:
      - '.github/workflows/oneoff-support-average.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align dummy subgroup average
        shell: python
        run: |
          from pathlib import Path
          p=Path('experience_read.html')
          s=p.read_text(encoding='utf-8')
          old="supportCompare:[{label:'地域包括・介護サービス等を利用',n:102,avg:8.2,strong:72},{label:'外部の相談・介護サービスをほぼ利用せず',n:26,avg:9.1,strong:85}]"
          new="supportCompare:[{label:'地域包括・介護サービス等を利用',n:102,avg:8.4,strong:72},{label:'外部の相談・介護サービスをほぼ利用せず',n:26,avg:9.4,strong:88}]"
          if old not in s: raise SystemExit('pattern not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "OpenAI project assistant"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience_read.html
          git commit -m "Align dementia support dummy subgroup average"
          git push
