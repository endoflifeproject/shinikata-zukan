name: Rebrand visible site to Shukatsu Lab

on:
  push:
    branches:
      - chore/rebrand-shukatsu-lab
    paths:
      - .github/workflows/rebrand-shukatsu-lab-once.yml

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/rebrand-shukatsu-lab
          fetch-depth: 0
      - name: Replace visible brand strings
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "死に方図鑑": "終活ラボ",
              "SHINIKATA ZUKAN": "SHUKATSU LAB",
              "Shinikata Zukan": "Shukatsu Lab",
          }
          extensions = {".html", ".htm", ".js", ".mjs", ".cjs", ".json", ".md", ".txt", ".xml", ".svg", ".css"}
          changed = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              new_text = text
              for old, new in replacements.items():
                  new_text = new_text.replace(old, new)
              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(str(path))
          print("Changed files:")
          for item in changed:
              print(item)
          PY
      - name: Remove one-time workflow and commit
        run: |
          rm -f .github/workflows/rebrand-shukatsu-lab-once.yml
          git config user.name "endoflifeproject"
          git config user.email "endoflife.project.jp@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Rename visible site brand to 終活ラボ"
          git push origin HEAD:chore/rebrand-shukatsu-lab
