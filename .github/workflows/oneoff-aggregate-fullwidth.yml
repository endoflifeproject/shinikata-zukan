name: One-off aggregate full width
on:
  push:
    paths:
      - '.github/workflows/oneoff-aggregate-fullwidth.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make aggregate metric full width
        shell: python
        run: |
          from pathlib import Path
          p=Path('experience_read.html')
          s=p.read_text(encoding='utf-8')
          repl={
            '.aggregate-grid{display:grid;grid-template-columns:460px 1fr;gap:46px}':'.aggregate-grid{display:grid;grid-template-columns:1fr;gap:24px}.aggregate-left{min-width:0;width:100%;max-width:none}',
            '.aggregate-right{min-width:0}.aggregate-right h2{margin-bottom:7px}.aggregate-summary{font-size:11px;color:#536a7d;margin:0 0 14px;max-width:650px}':'.aggregate-right{min-width:0;width:100%;margin-top:2px;padding-top:22px;border-top:1px solid #e6edf1}.aggregate-right h2{margin-bottom:7px}.aggregate-summary{font-size:11px;color:#536a7d;margin:0 0 14px;max-width:none}',
            '@media(max-width:940px){.aggregate-grid{grid-template-columns:1fr;gap:24px}.aggregate-left{max-width:650px}':'@media(max-width:940px){.aggregate-grid{grid-template-columns:1fr;gap:22px}.aggregate-left{max-width:none;width:100%}',
            '疾病 × テーマ回遊 v4.2 ／ プレテスト':'疾病 × テーマ回遊 v4.3 ／ プレテスト'
          }
          for old,new in repl.items():
            if old not in s:
              raise SystemExit('missing pattern: '+old[:80])
            s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        shell: bash
        run: |
          git config user.name "OpenAI project assistant"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experience_read.html
          git commit -m "Expand aggregate metric to full width"
          git push
