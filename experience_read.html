<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>終活ラボ｜体験を読む</title></head><body><p style="max-width:760px;margin:50px auto;font-family:-apple-system,BlinkMacSystemFont,'Noto Sans JP','Yu Gothic',Meiryo,sans-serif;padding:20px;color:#5b7082">体験ページを読み込んでいます…</p><script>(async function(){const ctaCss=`.experience-contribute{margin:0 0 24px;border:1px solid #cfe0e9;border-radius:18px;background:linear-gradient(135deg,#f3f9fc,#fffaf0);box-shadow:0 12px 30px rgba(32,73,105,.07);overflow:hidden}.experience-contribute-inner{display:flex;align-items:center;justify-content:space-between;gap:24px;padding:18px 22px}.experience-contribute-copy{min-width:0}.experience-contribute-kicker{display:block;margin-bottom:3px;color:#9a7634;font-size:8.5px;font-weight:900;letter-spacing:.08em}.experience-contribute h2{margin:0 0 4px!important;color:#234f70!important;font-family:'Yu Mincho','Hiragino Mincho ProN',serif!important;font-size:17px!important;line-height:1.55!important;letter-spacing:.04em!important}.experience-contribute p{margin:0;color:#667b8a;font-size:9.5px;line-height:1.75}.experience-contribute-btn{flex:0 0 auto;display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:10px 15px;background:#164f82;color:#fff!important;font-size:9.5px;font-weight:900;white-space:nowrap;box-shadow:0 8px 20px rgba(22,79,130,.18);transition:.18s}.experience-contribute-btn:hover{transform:translateY(-1px);box-shadow:0 11px 24px rgba(22,79,130,.24)}.experience-contribute-bottom{margin:30px 0 22px;background:linear-gradient(135deg,#edf7fb,#fff7e8)}.experience-contribute-bottom .experience-contribute-inner{padding:23px 25px}.experience-contribute-bottom h2{font-size:19px!important}@media(max-width:720px){.experience-contribute-inner{align-items:flex-start;flex-direction:column;gap:13px;padding:17px}.experience-contribute-btn{width:100%;justify-content:center}.experience-contribute-bottom .experience-contribute-inner{padding:19px 17px}}`;const topCta=`<aside class="experience-contribute experience-contribute-top" aria-label="体験投稿のご案内"><div class="experience-contribute-inner"><div class="experience-contribute-copy"><span class="experience-contribute-kicker">YOUR EXPERIENCE MATTERS</span><h2>あなたの経験が、次の誰かの判断材料になります。</h2><p>看取り、療養、介護、治療の選択。ご家族、介護職、医療・福祉職、当事者の方からの体験を募集しています。</p></div><a class="experience-contribute-btn" href="experience_write.html">体験を投稿する <span>→</span></a></div></aside>`;const bottomCta=`<aside class="experience-contribute experience-contribute-bottom" aria-label="体験投稿のご案内"><div class="experience-contribute-inner"><div class="experience-contribute-copy"><span class="experience-contribute-kicker">SHARE YOUR STORY</span><h2>あなたが見たこと、迷ったこと、選んだことを残しませんか？</h2><p>一人ひとりの経験が集まることで、これから療養や看取りに向き合う人が比較し、考えるための情報になります。個人が特定される情報は書かず、書ける範囲で投稿してください。</p></div><a class="experience-contribute-btn" href="experience_write.html">体験を投稿する <span>→</span></a></div></aside>`;try{const r=await fetch('experience_read_base.html',{cache:'no-store'});if(!r.ok)throw new Error('base '+r.status);let h=await r.text();h=h.replace('</style>',ctaCss+'</style>');h=h.replace('<section class="search-panel"',topCta+'<section class="search-panel"');h=h.replace('</section>\n<div class="note">疾病 →','</section>'+bottomCta+'\n<div class="note">疾病 →');document.open();document.write(h);document.close();}catch(e){document.body.innerHTML='<main style="max-width:760px;margin:50px auto;font-family:-apple-system,BlinkMacSystemFont,\'Noto Sans JP\',sans-serif;padding:20px;color:#415b70"><h1 style="font-size:22px">体験ページを読み込めませんでした</h1><p>ページを再読み込みするか、下のリンクから元の体験ページを開いてください。</p><p><a href="experience_read_base.html" style="color:#164f82;font-weight:700">体験を読むページを開く →</a></p></main>';}})();</script></body></html>
