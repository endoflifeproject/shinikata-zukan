<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>死に方図鑑｜体験を読む</title>
</head>
<body>
<p style="max-width:760px;margin:50px auto;font-family:sans-serif;padding:20px">体験ページを読み込んでいます…</p>
<script>
(async function(){
  try{
    const r=await fetch('https://raw.githubusercontent.com/endoflifeproject/shinikata-zukan/6af99c74468c84d9c3c47478bb6f69e1705b2dc3/experience_read.html',{cache:'no-store'});
    if(!r.ok)throw new Error('base '+r.status);
    let h=await r.text();
    h=h.replace('</body>','<script defer src="assets/js/experience_read_manga_plan.js?v=20260817-1"><\\/script></body>');
    document.open();
    document.write(h);
    document.close();
  }catch(e){
    document.body.innerHTML='<main style="max-width:760px;margin:50px auto;font-family:sans-serif;padding:20px"><h1>読み込みに失敗しました</h1><p>ページを再読み込みしてください。</p></main>';
  }
})();
</script>
</body>
</html>
