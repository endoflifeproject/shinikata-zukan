<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">実際、どうだった？</title><desc id="d">みんなの体験談のピックアップ画像</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eef6ff"/><stop offset="1" stop-color="#e2effc"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="11" stdDeviation="17" flood-color="#224f7c" flood-opacity=".14"/></filter></defs><rect width="1200" height="675" rx="40" fill="url(#bg)"/><circle cx="1070" cy="80" r="170" fill="#fff" opacity=".4"/><text x="72" y="88" font-family="sans-serif" font-size="22" font-weight="700" fill="#5d7894" letter-spacing="4">PICK UP 02</text><text x="72" y="220" font-family="Yu Mincho,Hiragino Mincho ProN,serif" font-size="86" font-weight="700" fill="#173f70">実際、どうだった？</text><rect x="72" y="255" width="390" height="10" rx="5" fill="#6aa6df"/><text x="75" y="325" font-family="sans-serif" font-size="28" fill="#4c6780">病気・介護・お金・看取りまで</text><text x="75" y="369" font-family="sans-serif" font-size="28" fill="#4c6780">みんなの体験を読む</text><g filter="url(#s)"><g transform="translate(635 130) rotate(-4 160 180)"><rect width="300" height="385" rx="22" fill="#fff"/><rect x="24" y="24" width="252" height="210" rx="18" fill="#dfeaf4"/><circle cx="150" cy="100" r="48" fill="#89a9c3"/><path d="M76 215c16-54 54-83 74-83s58 29 74 83" fill="#7297b5"/><text x="30" y="278" font-family="sans-serif" font-size="24" font-weight="700" fill="#254f73">認知症／70代</text><text x="30" y="318" font-family="sans-serif" font-size="19" fill="#657b8f">「家で過ごせてよかった」</text><rect x="30" y="340" width="158" height="25" rx="13" fill="#edf5fb"/><text x="46" y="359" font-family="sans-serif" font-size="14" fill="#3c6f99">在宅・介護・費用</text></g><g transform="translate(888 205) rotate(5 120 150)"><rect width="235" height="310" rx="20" fill="#fff"/><rect x="20" y="20" width="195" height="160" rx="16" fill="#f3e7d4"/><circle cx="117" cy="82" r="38" fill="#c49b68"/><path d="M60 168c15-42 42-65 57-65s43 23 58 65" fill="#b28358"/><text x="26" y="218" font-family="sans-serif" font-size="21" font-weight="700" fill="#254f73">肺がん／60代</text><text x="26" y="253" font-family="sans-serif" font-size="17" fill="#657b8f">治療を続けるか迷った</text><rect x="26" y="270" width="145" height="22" rx="11" fill="#fff3d8"/><text x="40" y="286" font-family="sans-serif" font-size="13" fill="#8c6c24">治療・意思決定</text></g></g><g transform="translate(72 485)"><rect width="430" height="92" rx="20" fill="#fff" opacity=".88"/><text x="28" y="39" font-family="sans-serif" font-size="20" font-weight="700" fill="#315f83">数字だけでは分からない、</text><text x="28" y="68" font-family="sans-serif" font-size="20" font-weight="700" fill="#315f83">その人の経過と選択まで。</text></g></svg>