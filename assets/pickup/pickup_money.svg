<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d"><title id="t">あなたのお金は、あと何年もつ？</title><desc id="d">老後資金シミュレーターのピックアップ画像</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ed"/><stop offset="1" stop-color="#e7f1df"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#214e3a" flood-opacity=".12"/></filter></defs><rect width="1200" height="675" rx="40" fill="url(#bg)"/><circle cx="1060" cy="110" r="150" fill="#fff" opacity=".48"/><circle cx="1000" cy="560" r="210" fill="#cfe2c4" opacity=".55"/><text x="72" y="88" font-family="sans-serif" font-size="22" font-weight="700" fill="#5d7867" letter-spacing="4">PICK UP 01</text><text x="72" y="210" font-family="Yu Mincho,Hiragino Mincho ProN,serif" font-size="70" font-weight="600" fill="#174f3e">あなたのお金は、</text><text x="72" y="300" font-family="Yu Mincho,Hiragino Mincho ProN,serif" font-size="82" font-weight="700" fill="#174f3e">あと何年もつ？</text><rect x="72" y="338" width="410" height="10" rx="5" fill="#d4b746"/><text x="75" y="405" font-family="sans-serif" font-size="28" fill="#496a5a">病気・介護・生活費から</text><text x="75" y="449" font-family="sans-serif" font-size="28" fill="#496a5a">これから先をシミュレーション</text><g transform="translate(720 166)" filter="url(#s)"><rect width="390" height="350" rx="28" fill="#fff"/><text x="34" y="58" font-family="sans-serif" font-size="24" font-weight="700" fill="#315e52">老後資金シミュレーター</text><rect x="34" y="88" width="322" height="86" rx="16" fill="#f6f8f4"/><text x="56" y="123" font-family="sans-serif" font-size="18" fill="#789083">現在の貯蓄</text><text x="56" y="157" font-family="sans-serif" font-size="36" font-weight="700" fill="#174f3e">1,200万円</text><rect x="34" y="194" width="322" height="86" rx="16" fill="#fff8dd"/><text x="56" y="229" font-family="sans-serif" font-size="18" fill="#8d7b45">このペースなら</text><text x="56" y="263" font-family="sans-serif" font-size="38" font-weight="800" fill="#8a6a18">あと 14.2年</text><path d="M56 310H330" stroke="#d8e3d5" stroke-width="12" stroke-linecap="round"/><path d="M56 310H224" stroke="#5da071" stroke-width="12" stroke-linecap="round"/><circle cx="224" cy="310" r="14" fill="#fff" stroke="#5da071" stroke-width="7"/></g><g transform="translate(610 500)"><rect width="130" height="90" rx="18" fill="#fff" opacity=".9"/><circle cx="38" cy="44" r="21" fill="#d9e8d1"/><path d="M30 44h16M38 36v16" stroke="#4f8061" stroke-width="5" stroke-linecap="round"/><text x="70" y="40" font-family="sans-serif" font-size="15" fill="#5c7468">医療</text><text x="70" y="62" font-family="sans-serif" font-size="15" fill="#5c7468">介護</text></g></svg>