<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>アンケート専門家レビュー</title></head>
<body>
<p id="loading" style="font-family:sans-serif;padding:24px;color:#48647c">アンケートの専門家レビュー版を読み込んでいます…</p>
<script>
(async function(){
  try{
    const r=await fetch('experience_case.html',{cache:'no-store'});
    if(!r.ok) throw new Error('base '+r.status);
    let h=await r.text();
    h=h.replace('</head>','<script src="assets/js/experience_api_config.js"><\\/script><script defer src="assets/js/experience_expert_review.js"><\\/script></head>');
    h=h.replace('統合プレテスト｜送信未接続','専門家レビュー｜アンケート設計評価');
    document.open(); document.write(h); document.close();
  }catch(e){document.getElementById('loading').textContent='読み込みに失敗しました。ページを再読み込みしてください。';}
})();
</script>
</body>
</html>
